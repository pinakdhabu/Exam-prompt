<style>
  :root {
    --bg: #0a0a0d;
    --surface: #141418;
    --surface-alt: #1a1a20;
    --text: #f4f4f5;
    --secondary: #a1a1aa;
    --muted: #52525b;
    --accent: #22d3ee;
    --accent-dim: rgba(34,211,238,0.10);
    --warm: #fb923c;
    --pink: #e879f9;
    --green: #4ade80;
    --yellow: #eab308;
    --border: #27272a;
    --border-bright: #3f3f46;
    --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 8px;
    --radius-sm: 5px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans); line-height: 1.65; font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  /* Scroll progress */
  .scroll-progress {
    position: fixed; top: 0; left: 0; z-index: 999;
    width: 0%; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--pink), var(--warm));
    transition: none;
  }

  /* Grain */
  .grain-overlay {
    position: fixed; inset: 0; z-index: 9998; pointer-events: none;
    opacity: 0.035; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.5'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 256px 256px;
  }

  /* Particles */
  .particles {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .particle {
    position: absolute; width: 2px; height: 2px;
    background: var(--accent); border-radius: 50%; opacity: 0;
    animation: particleFloat 15s linear infinite;
  }
  .particle:nth-child(odd) { width: 1px; height: 1px; animation-duration: 12s; }
  .particle:nth-child(3n) { animation-duration: 18s; animation-delay: -5s; }
  .particle:nth-child(5n+2) { animation-delay: -3s; background: var(--pink); }
  .particle:nth-child(7n+3) { animation-delay: -8s; background: var(--warm); }
  @keyframes particleFloat {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-10vh) translateX(40px); opacity: 0; }
  }

  /* Cursor glow */
  .cursor-glow {
    position: fixed; width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,0.06) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
    transform: translate(-50%, -50%); opacity: 0; transition: opacity 0.3s;
  }

  /* Mesh background */
  .mesh-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .mesh-bg .orb {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.25;
    animation: orbFloat 20s ease-in-out infinite;
  }
  .mesh-bg .orb:nth-child(1) { width: 400px; height: 400px; background: var(--accent-dim); top: -10%; left: -10%; }
  .mesh-bg .orb:nth-child(2) { width: 300px; height: 300px; background: rgba(232,121,249,0.06); bottom: -5%; right: -5%; animation-delay: -7s; }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(40px, -30px) scale(1.05); }
    50% { transform: translate(-20px, 40px) scale(0.95); }
    75% { transform: translate(30px, 20px) scale(1.02); }
  }
  .mesh-bg::after {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
    background-size: 24px 24px;
  }

  .container { max-width: 1040px; margin: 0 auto; padding: 0 28px; position: relative; z-index: 1; }

  /* Scroll reveals with scale+blur */
  .reveal {
    opacity: 0; transform: translateY(20px) scale(0.97); filter: blur(3px);
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                filter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .reveal.visible { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  .reveal-delay-1 { transition-delay: 0.05s; }
  .reveal-delay-2 { transition-delay: 0.1s; }
  .reveal-delay-3 { transition-delay: 0.15s; }

  /* Header */
  header {
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,13,0.85); backdrop-filter: blur(20px) saturate(1.5);
  }
  header .container { display: flex; align-items: center; justify-content: space-between; height: 52px; }
  header .logo { font-family: var(--font-mono); font-weight: 700; font-size: 0.88rem; letter-spacing: -0.02em; }
  header .logo a { color: var(--text); text-decoration: none; }
  header .logo span { color: var(--accent); }
  header .logo .logo-dot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); margin-left: 2px; vertical-align: middle;
    animation: pulseDot 2s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }
  header nav { display: flex; gap: 2px; }
  header nav a {
    color: var(--secondary); text-decoration: none; padding: 6px 14px;
    font-family: var(--font-mono); font-size: 0.75rem; font-weight: 500;
    border-radius: var(--radius-sm); transition: color 0.2s, background 0.2s;
  }
  header nav a:hover { color: var(--text); background: var(--surface); }

  /* Page header */
  .page-head { padding: 48px 0 24px; }
  .page-head .term-line { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; }
  .page-head .term-line .arrow { color: var(--accent); }
  .page-head h1 { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }
  .page-head p { color: var(--secondary); font-size: 0.88rem; max-width: 560px; line-height: 1.6; }
  .page-head .count { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); margin-top: 8px; }

  /* Search + Filter */
  .controls-bar { display: flex; gap: 8px; padding: 20px 0; flex-wrap: wrap; align-items: center; }
  .search-box {
    position: relative; flex: 1; min-width: 200px;
  }
  .search-box input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 7px 14px 7px 34px; border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-size: 0.72rem; outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 24px rgba(34,211,238,0.06); }
  .search-box input::placeholder { color: var(--muted); }
  .search-box .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 0.7rem; font-family: var(--font-mono);
    pointer-events: none;
  }
  .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    background: transparent; border: 1px solid var(--border); color: var(--secondary);
    padding: 5px 16px; border-radius: 20px; font-size: 0.72rem; cursor: pointer;
    font-family: var(--font-mono); font-weight: 500; transition: all 0.3s;
  }
  .filter-btn:hover { border-color: var(--border-bright); color: var(--text); transform: translateY(-1px); }
  .filter-btn:active { transform: translateY(0) scale(0.97); }
  .filter-btn.active {
    background: var(--accent); border-color: var(--accent); color: #0a0a0d;
    box-shadow: 0 0 20px rgba(34,211,238,0.15);
  }
  .filter-btn .count-badge {
    display: inline-block; background: rgba(255,255,255,0.08);
    padding: 0 6px; border-radius: 10px; font-size: 0.6rem; margin-left: 4px;
    color: var(--muted);
  }
  .filter-btn.active .count-badge { background: rgba(0,0,0,0.15); color: #0a0a0d; }

  /* Skills list */
  .skills-list {
    display: flex; flex-direction: column; gap: 1px;
    background: var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 48px;
  }
  .skill-item {
    background: var(--surface); padding: 24px; transition: all 0.4s;
    position: relative; overflow: hidden;
  }
  .skill-item::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
    opacity: 0; transition: opacity 0.3s;
  }
  .skill-item:hover {
    background: var(--surface-alt);
    transform: translateX(3px);
  }
  .skill-item:hover::before { opacity: 1; }
  .skill-item:active { transform: translateX(0); }

  .skill-item h3 { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  .skill-item h3 .tag {
    display: inline-block; font-family: var(--font-mono); font-size: 0.58rem; font-weight: 600;
    padding: 2px 12px; border: 1px solid var(--border); margin-left: 10px;
    color: var(--muted); border-radius: 20px; vertical-align: middle;
    letter-spacing: 0.02em;
  }

  .skill-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .skill-meta span {
    font-family: var(--font-mono); font-size: 0.63rem; font-weight: 500;
    color: var(--muted); border: 1px solid var(--border);
    padding: 2px 10px; border-radius: 20px; transition: all 0.3s;
  }
  .skill-meta span:hover { border-color: var(--border-bright); color: var(--secondary); }
  .skill-meta a {
    font-family: var(--font-mono); font-size: 0.63rem; color: var(--accent);
    text-decoration: none; padding: 2px 12px; border: 1px solid var(--border);
    border-radius: 20px; transition: all 0.3s;
  }
  .skill-meta a:hover { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-dim); }

  .skill-detail {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
    margin-top: 6px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1), margin 0.3s ease;
  }
  .skill-detail.open {
    max-height: 200px;
  }
  .skill-detail p {
    color: var(--secondary); font-size: 0.82rem; line-height: 1.6;
    border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px;
  }
  .skill-detail p strong { color: var(--text); font-weight: 500; }

  .toggle-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-family: var(--font-mono); font-size: 0.65rem; padding: 0;
    transition: color 0.2s;
  }
  .toggle-btn:hover { color: var(--accent); }

  .empty-state {
    background: var(--surface); padding: 48px; text-align: center;
    font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted);
  }
  .empty-state span { color: var(--accent); }

  /* Footer */
  footer { border-top: 1px solid var(--border); padding: 32px 0; text-align: center; }
  footer p { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .footer-links {
    display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px;
  }
  footer .footer-links a {
    font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted);
    text-decoration: none; transition: color 0.2s;
  }
  footer .footer-links a:hover { color: var(--text); text-decoration: none; }

  a { color: var(--accent); }
  .hidden { display: none; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }

  @keyframes fadeInItem {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (hover: none) {
    .cursor-glow { display: none !important; }
    .grain-overlay { opacity: 0.02; }
    .skill-item:hover { transform: none; }
  }

  @media (max-width: 768px) {
    header nav a { padding: 4px 8px; font-size: 0.7rem; }
    .page-head { padding: 32px 0 16px; }
    .skill-item { padding: 18px; }
    .skill-item:hover { transform: none; }
    .controls-bar { flex-direction: column; align-items: stretch; }
    .search-box { min-width: auto; }
  }
</style>
</head>

const list = document.getElementById('skillsList');
const searchInput = document.getElementById('searchInput');
let currentFilter = 'all';
let currentSearch = '';

function getFiltered() {
  let filtered = skills;
  if (currentFilter !== 'all') {
    filtered = filtered.filter(s => s.cat === currentFilter);
  }
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    filtered = filtered.filter(s =>
      s.name.toLowerCase().includes(q) ||
      s.desc.toLowerCase().includes(q) ||
      s.tags.some(t => t.includes(q))
    );
  }
  return filtered;
}

function render() {
  const filtered = getFiltered();
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state">no skills match <span>"${currentSearch}"</span></div>`;
    return;
  }
  list.innerHTML = filtered.map((s, i) => `
    <div class="skill-item" style="animation: fadeInItem 0.3s ease ${i * 0.03}s both">
      <h3>${s.name} <span class="tag">${s.cat}</span></h3>
      <div class="skill-detail open">
        <p>${s.desc}</p>
      </div>
      <div class="skill-meta">
        ${s.tags.map(t => `<span>${t}</span>`).join('')}
        <a href="https://raw.githubusercontent.com/pinakdhabu/Exam-prompt/main/skills/${s.url}/SKILL.md" target="_blank">SKILL.md</a>
        ${s.gem ? `<a href="${s.gem}" target="_blank" style="color:var(--warm);border-color:var(--warm)">gemini gem</a>` : ''}
      </div>
    </div>
  `).join('');
  document.getElementById('skillCount').textContent = `${filtered.length} skills &middot; 6 categories`;
}

render();

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

// Search
searchInput.addEventListener('input', () => {
  currentSearch = searchInput.value;
  render();
});

// Scroll reveal
document.addEventListener('DOMContentLoaded', () => {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
});

// Scroll progress
const progressBar = document.getElementById('scrollProgress');
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  progressBar.style.width = docHeight > 0 ? ((scrollTop / docHeight) * 100) + '%' : '0%';
}, { passive: true });

// Particles
const particlesContainer = document.getElementById('particles');
for (let i = 0; i < 15; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.animationDelay = (Math.random() * 10) + 's';
  p.style.animationDuration = (12 + Math.random() * 10) + 's';
  p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
  particlesContainer.appendChild(p);
}

// Cursor glow
const cursorGlow = document.getElementById('cursorGlow');
let cursorTimer;
document.addEventListener('mousemove', (e) => {
  cursorGlow.style.left = e.clientX + 'px';
  cursorGlow.style.top = e.clientY + 'px';
  cursorGlow.style.opacity = '1';
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => { cursorGlow.style.opacity = '0'; }, 3000);
});
</script>
