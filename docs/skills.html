<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills — Exam Prompt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0e;
    --surface: #18181b;
    --surface-alt: #1f1f23;
    --text: #f4f4f5;
    --secondary: #a1a1aa;
    --muted: #52525b;
    --accent: #22d3ee;
    --accent-dim: rgba(34,211,238,0.12);
    --warm: #fb923c;
    --success: #4ade80;
    --border: #27272a;
    --border-bright: #3f3f46;
    --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 6px;
    --radius-sm: 4px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans); line-height: 1.65; font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
    background-size: 28px 28px; pointer-events: none; z-index: 0;
  }
  .container { max-width: 1040px; margin: 0 auto; padding: 0 28px; position: relative; z-index: 1; }

  /* Header */
  header {
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    background: rgba(12,12,14,0.88); backdrop-filter: blur(16px);
  }
  header .container { display: flex; align-items: center; justify-content: space-between; height: 52px; }
  header .logo { font-family: var(--font-mono); font-weight: 700; font-size: 0.88rem; letter-spacing: -0.02em; }
  header .logo a { color: var(--text); text-decoration: none; }
  header .logo span { color: var(--accent); }
  header nav { display: flex; gap: 2px; }
  header nav a {
    color: var(--secondary); text-decoration: none; padding: 6px 14px;
    font-family: var(--font-mono); font-size: 0.75rem; font-weight: 500;
    border-radius: var(--radius-sm); transition: color 0.15s, background 0.15s;
  }
  header nav a:hover { color: var(--text); background: var(--surface); }

  /* Page header */
  .page-head { padding: 48px 0 28px; }
  .page-head .term-line { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; }
  .page-head .term-line .arrow { color: var(--accent); }
  .page-head h1 { font-family: var(--font-mono); font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
  .page-head p { color: var(--secondary); font-size: 0.9rem; max-width: 560px; }
  .page-head .count { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); margin-top: 8px; }

  /* Filter */
  .filter-bar { display: flex; gap: 6px; padding: 20px 0; flex-wrap: wrap; }
  .filter-btn {
    background: transparent; border: 1px solid var(--border); color: var(--secondary);
    padding: 5px 16px; border-radius: var(--radius-sm); font-size: 0.72rem; cursor: pointer;
    font-family: var(--font-mono); font-weight: 500; transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--border-bright); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #0c0c0e; }

  /* Skills list */
  .skills-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 48px; }
  .skill-item {
    background: var(--surface); padding: 24px; transition: background 0.15s;
  }
  .skill-item:hover { background: var(--surface-alt); }

  .skill-item h3 { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  .skill-item h3 .tag {
    display: inline-block; font-family: var(--font-mono); font-size: 0.6rem; font-weight: 500;
    padding: 1px 10px; border: 1px solid var(--border); margin-left: 10px;
    color: var(--muted); border-radius: var(--radius-sm); vertical-align: middle;
    letter-spacing: 0.02em;
  }

  .skill-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .skill-meta span {
    font-family: var(--font-mono); font-size: 0.63rem; font-weight: 500;
    color: var(--muted); border: 1px solid var(--border);
    padding: 2px 10px; border-radius: var(--radius-sm);
  }
  .skill-meta a {
    font-family: var(--font-mono); font-size: 0.63rem; color: var(--accent);
    text-decoration: none; padding: 2px 10px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); transition: all 0.15s;
  }
  .skill-meta a:hover { border-color: var(--accent); }

  .skill-detail {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
    margin-top: 6px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease, margin 0.3s ease;
  }
  .skill-detail.open {
    max-height: 300px;
  }
  .skill-detail p {
    color: var(--secondary); font-size: 0.82rem; line-height: 1.6;
    border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px;
  }
  .skill-detail p strong { color: var(--text); font-weight: 500; }

  .toggle-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-family: var(--font-mono); font-size: 0.65rem; padding: 0;
    transition: color 0.15s;
  }
  .toggle-btn:hover { color: var(--accent); }

  /* Footer */
  footer { border-top: 1px solid var(--border); padding: 32px 0; text-align: center; }
  footer p { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  a { color: var(--accent); }
  .hidden { display: none; }

  @media (max-width: 768px) {
    header nav a { padding: 4px 8px; font-size: 0.7rem; }
    .page-head { padding: 32px 0 20px; }
    .skill-item { padding: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="logo"><a href="index.html">exam<span>~</span>prompt</a></div>
    <nav>
      <a href="index.html">home</a>
      <a href="app.html">app</a>
      <a href="https://github.com/pinakdhabu/Exam-prompt">src</a>
    </nav>
  </div>
</header>

<div class="page-head">
  <div class="container">
    <div class="term-line"><span class="arrow">&gt;</span> ls skills/</div>
    <h1>Academic Skills</h1>
    <p>24 SKILL.md files — one per exam task. Self-contained, portable, exam-ready.</p>
    <div class="count">26 skills · 6 categories</div>
  </div>
</div>

<div class="container">
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all">all</button>
    <button class="filter-btn" data-filter="core">core</button>
    <button class="filter-btn" data-filter="writing">writing</button>
    <button class="filter-btn" data-filter="analysis">analysis</button>
    <button class="filter-btn" data-filter="practice">practice</button>
    <button class="filter-btn" data-filter="planning">planning</button>
    <button class="filter-btn" data-filter="infra">infrastructure</button>
  </div>
</div>

<div class="container">

  <div class="skills-list" id="skillsList"></div>

</div>

<footer>
  <div class="container">
    <p>MIT &middot; <a href="https://github.com/pinakdhabu/Exam-prompt">github/pinakdhabu/Exam-prompt</a> &middot; 26 academic skills</p>
  </div>
</footer>

<script>
const skills = [
  {
    name: 'A+ Answer Writer',
    cat: 'core',
    tags: ['answer-writer', 'core'],
    desc: '15-phase answer generation pipeline with anti-deduction guard. Handles every question type (theory, numerical, MCQ, case study, derivation, diagram, design), every mark level (1-100+), every Bloom\'s level, and every command word (Define, Explain, Compare, Evaluate, Design, etc.). Pre-configured for SPPU Computer Engineering with universal adaptability via syllabus PDF input.',
    url: 'answer-writer',
    gem: 'https://gemini.google.com/gem/1PGOZXhIROLOGU88epT7JGgV3bnXDTcJK'
  },
  {
    name: 'Notes Generator',
    cat: 'core',
    tags: ['notes', 'core'],
    desc: '12+ note formats with automatic selection: Cornell, Mind Map, Flowchart, Q&A, Rapid Revision, Outline, Matrix, Timeline, Summary, Cheat Sheet, Diagram, Flashcards. Picks the optimal format based on subject type (theory/practical/math), exam conditions (closed/open book), time available, and learning style.',
    url: 'notes-generator',
    gem: 'https://gemini.google.com/gem/bf5b14582187'
  },
  {
    name: 'PYQ Analyzer',
    cat: 'core',
    tags: ['analysis', 'core'],
    desc: '13+ statistical analyses on previous year question papers: frequency distribution, unit-wise weightage, Bloom\'s level heatmap, CO mapping, question type trends, difficulty drift, repeated question detection, topic coverage gaps, and probability-ranked predictions with recency adjustment. PYQ PDFs required as input.',
    url: 'pyq-analyzer',
    gem: 'https://gemini.google.com/gem/1W8EC9fMchTr3bVl_X4ncnPGWNsEM5heh'
  },
  {
    name: 'IMP Topics Generator',
    cat: 'core',
    tags: ['strategy', 'core'],
    desc: '5 probability levels (90%+, 70%+, 50%+, 30%+, 10%+), 7 time-plan options (from 7 days to 1 hour), and GPA-targeted tracks for 10/10, 8/10, and pass goals. Per-unit strategies with exact question predictions. Requires PYQ analysis output as input. Never generates answers — focuses on what to study.',
    url: 'imp-topics-generator',
    gem: 'https://gemini.google.com/gem/4266a7e8000e'
  },
  {
    name: 'Assignment Writer',
    cat: 'writing',
    tags: ['writing'],
    desc: '12 assignment types across 6 output formats. Supports theory, numerical, case study, research, literature review, project proposals, design, analysis, comparison, critical review, problem-solving, and diagram/illustration. Always includes marking scheme breakdown, Bloom\'s level mapping, and CO alignment.',
    url: 'assignment-writer'
  },
  {
    name: 'Exam Paper Generator',
    cat: 'writing',
    tags: ['writing'],
    desc: '11+ university patterns: SPPU (2019 + 2024), VTU, JNTU, Mumbai, AKTU, RGPV, IIT/NIT, North American, UK/Oxford/Cambridge, and Generic. 13 question types, CO/Bloom mapping, marking schemes, and model answer keys. Generates complete question papers with OR/AE alternatives.',
    url: 'exam-paper-generator'
  },
  {
    name: 'Subject Prompt Bank',
    cat: 'writing',
    tags: ['writing'],
    desc: '8 discipline templates: Engineering, Science, Law, Medical, Computer Science, Mathematics, Humanities, and Management. 16 sample answers across 2, 4, 6, 10, and 15-mark levels. Each answer is time-budgeted and follows the discipline\'s academic conventions.',
    url: 'subject-prompt-bank'
  },
  {
    name: 'Lab Report Writer',
    cat: 'writing',
    tags: ['writing'],
    desc: '4 lab templates: Engineering (Aim-Apparatus-Theory- Procedure-Observations-Calculations-Results-Conclusion), Science (Hypothesis-Materials-Method-Analysis), Medical (Patient-Method-Results-Discussion), and Research (Abstract-Introduction-Methodology-Results). Each includes error analysis and viva questions.',
    url: 'lab-report-writer'
  },
  {
    name: 'Case Study Solver',
    cat: 'writing',
    tags: ['writing'],
    desc: '10+ structured frameworks: SWOT, PESTEL, Porter\'s Five Forces, BCG Matrix, Ansoff Matrix, Root Cause Analysis, Fishbone, 5 Whys, FMEA, IRAC, Ethical Matrix, Stakeholder Analysis, Decision Tree, Cost-Benefit Analysis. Covers business, engineering, medical, legal, ethical, and technical case studies.',
    url: 'case-study-solver'
  },
  {
    name: 'Essay Grader',
    cat: 'writing',
    tags: ['writing'],
    desc: 'Per-criterion evaluation: 7 criteria for theory questions (Accuracy, Completeness, Structure, Examples, Depth, Clarity, Presentation), 5 for numerical (Formula, Method, Calculation, Units, Answer), and 7 for essays (Thesis, Argumentation, Evidence, Organization, Language, Analysis, Conclusion). Each scored 0-5 with justifications.',
    url: 'essay-grader'
  },
  {
    name: 'Formula Sheet Generator',
    cat: 'analysis',
    tags: ['reference'],
    desc: '10 categories: engineering, mathematics, physics, chemistry, finance, statistics, data science, electronics, mechanics, and thermodynamics. Each formula entry includes name, expression (boxed), variable definitions with SI units, applicability conditions, and cross-references to related formulas.',
    url: 'formula-sheet-generator'
  },
  {
    name: 'Mind Map Generator',
    cat: 'analysis',
    tags: ['visual'],
    desc: 'Three output formats: Mermaid syntax (preferred), text outline (hierarchical), and image descriptions (for visual rendering). Color-coded by Bloom\'s level (L1-L6) and priority markers [IMP], [FREQ], [LINK], [NEW]. Shows cross-links between related topics across units.',
    url: 'mind-map-generator'
  },
  {
    name: 'Cross-Subject Mapper',
    cat: 'analysis',
    tags: ['visual'],
    desc: 'Maps conceptual connections across courses. Outputs: dependency graphs (prerequisites and follow-ups), shared concept matrices, integrated study paths (learn related topics together), and program-level maps showing how all courses interconnect. Essential for comprehensive and interdisciplinary exams.',
    url: 'cross-subject-mapper'
  },
  {
    name: 'Flashcard Generator',
    cat: 'practice',
    tags: ['practice'],
    desc: '6 card types across 3 difficulty tiers: Fact (basic recall), Cloze (fill-in-blank), Concept (definition), Problem (calculation/application), Scenario (situation-response), and Compare (X vs Y differentiation). Built-in SRS metadata (initial interval 1 day, ease factor 2.5). Exports to Anki, Quizlet, CSV, and text.',
    url: 'flashcard-generator'
  },
  {
    name: 'MCQ Practice Generator',
    cat: 'practice',
    tags: ['practice'],
    desc: '9 MCQ patterns: single correct, multiple correct, assertion-reason, match-the-following, true/false, fill-in-blank, sequence ordering, analogy, and comprehension passage. Bloom\'s-calibrated difficulty (L1-L5). Each question includes correct answer, detailed explanation, and distractor strategy showing why each wrong option targets a specific misconception.',
    url: 'mcq-practice-generator'
  },
  {
    name: 'Viva / Oral Exam Prep',
    cat: 'practice',
    tags: ['practice'],
    desc: '8 viva types: lab, course, project, PhD defense, interview, panel, online, and surprise viva. Uses CLAIM-EVIDENCE-LINK framework. Simulates examiner-student dialogue starting from basic to advanced, with anticipated follow-up probes. Scores on accuracy, clarity, depth, and confidence. Provides model answer after user attempts.',
    url: 'viva-oral-exam-prep'
  },
  {
    name: 'Last-Minute Crammer',
    cat: 'practice',
    tags: ['practice'],
    desc: 'Emergency plans for 12h (full syllabus scan + L1/L2 practice), 6h (L1 only + 1 mock question per unit), 3h (topic headings + key formulas), and 1h (bullet-point memorization + formula list). Uses memory palace, chunking, peg system, acronym chains, and story method. Includes exam hall strategy for time allocation and handling unknowns.',
    url: 'last-minute-crammer'
  },
  {
    name: 'Study Planner',
    cat: 'planning',
    tags: ['strategy'],
    desc: '4 plan types: Marathon (30+ days, 4-6h/day, balanced), Sprint (7-14 days, 6-8h/day, intensive), Cram (1-3 days, 10-12h/day, emergency), and Balanced (semester-long, 2-3h/day, gradual). Each plan includes time allocation by difficulty and weightage, spaced repetition review sessions, active recall breaks, weekly mock tests, and rest days.',
    url: 'study-planner'
  },
  {
    name: 'University Adapter',
    cat: 'infra',
    tags: ['infra'],
    desc: 'Auto-detects any university from PDFs, uploaded files, verbal descriptions, URLs, or implicit context. Identifies exam pattern (Indian, US, UK, European, Australian, Asian, Generic) and routes to the correct skill. Outputs a JSON configuration profile with university name, pattern details, and recommended skill for the task.',
    url: 'universal-university-adapter'
  },
  {
    name: 'Session Config',
    cat: 'infra',
    tags: ['infra'],
    desc: 'Persistent session configuration stored as a JSON profile. Stores university, subject, exam pattern, and user preferences across all 26 skills. Set once via bash scripts/profile.sh — shared across every skill. Eliminates redundant context detection.',
    url: 'session-config'
  },
  {
    name: 'Document Reader',
    cat: 'infra',
    tags: ['infra'],
    desc: 'Converts any document (PDF, DOCX, images, scanned) to clean LLM-friendly text. Supports text PDFs, OCR-scanned PDFs (tesseract), Word docs, images, PowerPoint, EPUB, and HTML. First step before any skill processing.',
    url: 'universal-document-reader'
  },
  {
    name: 'Document Generator',
    cat: 'infra',
    tags: ['infra'],
    desc: 'Converts Markdown study content to print-ready PDF documents with A4 professional formatting. Two backends: Python (weasyprint) and Node.js (Playwright). Completes the 3-stage pipeline: PDF → TXT → MD → PDF.',
    url: 'document-generator'
  },
  {
    name: 'QP Fetcher',
    cat: 'infra',
    tags: ['infra'],
    desc: 'Auto-fetches previous year question papers from university websites using Playwright or Python fallback. Fuzzy subject matching, rate limiting, retry logic. Covers all semesters and branches. One-command: npm run fetch:qp.',
    url: 'qp-fetcher'
  },
  {
    name: 'SPPU Exam Simulator',
    cat: 'planning',
    tags: ['strategy'],
    desc: 'Physical exam hall simulation engine. Models 36-page answer booklet, 34 writable pages, writing speed, time pressure, and examiner psychology. Use alongside Answer Writer for realistic exam practice.',
    url: 'sppu-exam-simulator'
  }
];

const list = document.getElementById('skillsList');

function render(filter) {
  const filtered = filter === 'all' ? skills : skills.filter(s => s.cat === filter);
  list.innerHTML = filtered.map(s => `
    <div class="skill-item">
      <h3>${s.name} <span class="tag">${s.cat}</span></h3>
      <div class="skill-detail open">
        <p>${s.desc}</p>
      </div>
      <div class="skill-meta">
        ${s.tags.map(t => `<span>${t}</span>`).join('')}
        <a href="https://raw.githubusercontent.com/pinakdhabu/Exam-prompt/main/skills/${s.url}/SKILL.md" target="_blank">SKILL.md</a>
        ${s.gem ? `<a href="${s.gem}" target="_blank" style="color:var(--warm);border-color:var(--warm)">gemini gem</a>` : ''}
      </div>
    </div>
  `).join('');
}

render('all');

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});
</script>
</body>
</html>
