<style>
  :root {
    --bg: #0a0a0d;
    --surface: #141418;
    --surface-alt: #1a1a20;
    --text: #f4f4f5;
    --secondary: #a1a1aa;
    --muted: #52525b;
    --accent: #22d3ee;
    --accent-dim: rgba(34,211,238,0.10);
    --warm: #fb923c;
    --green: #4ade80;
    --border: #27272a;
    --border-bright: #3f3f46;
    --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 8px;
    --radius-sm: 5px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans); height: 100vh; display: flex; flex-direction: column;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }

  /* Grain */
  .grain-overlay {
    position: fixed; inset: 0; z-index: 9998; pointer-events: none;
    opacity: 0.035; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.5'/%3E%3C/svg%3E");
    background-repeat: repeat; background-size: 256px 256px;
  }

  /* Particles */
  .particles {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .particle {
    position: absolute; width: 2px; height: 2px;
    background: var(--accent); border-radius: 50%; opacity: 0;
    animation: particleFloat 15s linear infinite;
  }
  .particle:nth-child(odd) { width: 1px; height: 1px; animation-duration: 12s; }
  .particle:nth-child(3n) { animation-duration: 18s; animation-delay: -5s; }
  .particle:nth-child(5n+2) { animation-delay: -3s; background: var(--pink); }
  @keyframes particleFloat {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-10vh) translateX(40px); opacity: 0; }
  }

  /* Cursor glow */
  .cursor-glow {
    position: fixed; width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,0.06) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
    transform: translate(-50%, -50%); opacity: 0; transition: opacity 0.3s;
  }

  /* Mesh background */
  .mesh-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .mesh-bg .orb {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.2;
    animation: orbFloat 20s ease-in-out infinite;
  }
  .mesh-bg .orb:nth-child(1) { width: 400px; height: 400px; background: var(--accent-dim); top: -10%; left: -10%; }
  .mesh-bg .orb:nth-child(2) { width: 300px; height: 300px; background: rgba(232,121,249,0.05); bottom: -5%; right: -5%; animation-delay: -7s; }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(40px, -30px) scale(1.05); }
    50% { transform: translate(-20px, 40px) scale(0.95); }
    75% { transform: translate(30px, 20px) scale(1.02); }
  }
  .mesh-bg::after {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
    background-size: 24px 24px;
  }

  header {
    padding: 0 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; gap: 8px; min-height: 52px;
    background: rgba(10,10,13,0.85); backdrop-filter: blur(20px) saturate(1.5);
    position: sticky; top: 0; z-index: 100;
  }
  header .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header .left a { color: var(--text); text-decoration: none; font-family: var(--font-mono); font-weight: 700; font-size: 0.88rem; letter-spacing: -0.02em; }
  header .left a span { color: var(--accent); }
  header .left .sep { color: var(--muted); font-size: 0.7rem; font-family: var(--font-mono); }
  header .left .label {
    color: var(--secondary); font-family: var(--font-mono); font-size: 0.72rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity 0.3s;
  }
  .controls { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  button, select {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 5px 14px; border-radius: var(--radius-sm); font-size: 0.72rem; cursor: pointer;
    font-family: var(--font-mono); font-weight: 500; line-height: 1.5;
    transition: all 0.2s; outline: none;
  }
  button:hover, select:hover { border-color: var(--border-bright); }
  button:active, select:active { transform: scale(0.97); }
  select:focus { border-color: var(--accent); }
  button.primary {
    background: linear-gradient(135deg, var(--accent), #06b6d4);
    border-color: var(--accent); color: #0a0a0d;
  }
  button.primary:hover { box-shadow: 0 0 30px var(--accent-dim); transform: translateY(-1px); }
  button.primary:active { transform: translateY(0) scale(0.97); }
  main {
    flex: 1; display: flex; flex-direction: column;
    max-width: 960px; margin: 0 auto; padding: 16px 16px 8px;
    width: 100%; min-height: 0; position: relative; z-index: 1;
  }
  textarea {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); padding: 12px 14px; font-size: 0.82rem; font-family: var(--font-mono);
    resize: vertical; width: 100%; transition: border-color 0.2s, box-shadow 0.2s;
  }
  textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 24px rgba(34,211,238,0.06);
  }
  #question { min-height: 70px; margin: 6px 0; flex-shrink: 0; }
  #prompt {
    flex: 1; min-height: 100px; font-size: 0.72rem; color: var(--secondary);
    transition: opacity 0.3s;
  }
  .hint { color: var(--muted); font-family: var(--font-mono); font-size: 0.68rem; margin: 3px 0 6px; }
  .hint .accent { color: var(--accent); }

  /* Toast notification */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--surface); border: 1px solid var(--border);
    padding: 10px 20px; border-radius: var(--radius);
    font-family: var(--font-mono); font-size: 0.72rem;
    color: var(--secondary); z-index: 200;
    opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .toast-icon { color: var(--green); }

  .row { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; align-items: center; }
  .row label { font-family: var(--font-mono); font-weight: 600; font-size: 0.75rem; color: var(--secondary); margin-right: 4px; }

  footer {
    border-top: 1px solid var(--border); padding: 8px 16px;
    font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted);
    text-align: center; flex-shrink: 0;
    background: rgba(10,10,13,0.5);
  }
  a { color: var(--accent); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  main > * { animation: fadeIn 0.4s ease both; }
  main > *:nth-child(2) { animation-delay: 0.05s; }
  main > *:nth-child(3) { animation-delay: 0.1s; }
  main > *:nth-child(4) { animation-delay: 0.15s; }
  main > *:nth-child(5) { animation-delay: 0.2s; }
  main > *:nth-child(6) { animation-delay: 0.25s; }

  @media (hover: none) {
    .cursor-glow { display: none !important; }
    .grain-overlay { opacity: 0.02; }
  }

  @media (max-width: 640px) {
    header { flex-wrap: wrap; min-height: auto; padding: 8px 12px; gap: 6px; }
    .controls { flex-wrap: wrap; }
    main { padding: 8px; }
    .toast { max-width: 90%; font-size: 0.68rem; }
  }
</style>
</head>

  "answer-writer": {

    desc: "10/10 GPA Exam Answer Generator at Senior Examiner + University Moderator level.",
    text: `# Universal Exam A+ System \u2014 Any University, Any Subject, 10/10 GPA

Full repository: https://github.com/pinakdhabu/Exam-prompt

You are now a 10/10 GPA Exam Answer Generator operating at Senior Examiner + University Moderator level.

## Universal Answer Rules

1. Direct answer only \u2014 no "Here is your answer", no preamble, no section labels
2. Third-person academic voice \u2014 assertive, no hedging
3. Bold every technical term on first use only
4. Numbered points for body. Tables for comparisons. Boxed answers for numericals.
5. For 4+ marks: definition + points + diagram (if structural) + example (if applicable) + closing line
6. 1 mark = 2-3 lines, 2 marks = 5-6 lines, ~3 lines per additional mark
7. Definition appears exactly once. Never repeat.
8. Never: "Firstly/Secondly/In conclusion/plays a crucial role/it is essential to understand"
9. Use Mermaid syntax for diagrams when possible.

## Command Word Resolution

Define/State: 1-2 lines. Precise definition. No elaboration.
List/Enumerate: Numbered items. One phrase per item.
Explain/Describe: Definition + 3-6 mechanism points + closing.
Discuss/Elaborate: Definition + mechanism + types + pros/cons + applications + closing.
Short note: Definition + 4-6 points + diagram + closing.
Compare/Differentiate: Table (Basis | X | Y) min 3 rows + preference closing.
Justify/Argue: Claim + 3-5 logical reasons + evidence + closing.
Evaluate/Assess: Criteria-based. Strengths + weaknesses + judgment.
Derive/Prove: Step-by-step. Name each formula. Box final expression.
Solve/Calculate: Given data -> formula -> stepwise working -> boxed answer with units.
Design/Develop: Requirements + design decisions + architecture + justification.
Illustrate with diagram: Diagram mandatory. All nodes labelled.
Apply/Demonstrate: Concept + named real-world instance + mapping.
Classify/Categorize: Group by criteria. Each group defined.
Recommend/Suggest: Options considered + evaluation + best pick + rationale.

## Marks-to-Depth Mapping
1-2 marks: 1-3 points, no diagram
3-4 marks: 3-5 points, diagram only if asked
5-6 marks: 5-7 points, diagram if structural, include example
7-8 marks: 7-9 points, mandatory diagram, include example
9-10 marks: 9-12 points, mandatory diagram, include example
10+: Proportional points, 2+ diagrams, multiple examples

## Bloom's Taxonomy (Do Not Mismatch)
L1 Remember (Define, List, State): Exact recall. No elaboration.
L2 Understand (Explain, Describe): Own words. Mechanism. Causality.
L3 Apply (Solve, Demonstrate): Named instance. Apply concept to it.
L4 Analyze (Compare, Classify): Break down. Table. Relationships.
L5 Evaluate (Justify, Recommend): Claim + evidence + reasoned judgment.
L6 Create (Design, Propose): Original output + design decisions.

## University Patterns
SPPU 2019: 6 units, 4 OR pairs, ESE U3-6 (70 marks)
SPPU 2024: 5 units, 5 OR pairs (70 marks)
VTU: 5 modules, full question with OR, 100 marks
JNTU: 8 units, Part A objective + Part B long
Mumbai Univ: Q1 compulsory + Q2-Q7 OR
AKTU: 5 units, A=MCQ B=short C=long
RGPV: 8 units, Part A short + Part B long
IIT/NIT: Mid-sem + End-sem, varies
North American: Midterm + Final, MCQs + problems
UK/Oxford/Cambridge: 3hr paper, essay-based
Generic: Default to 5 units, 100 marks, 3 hrs

## Exam Conditions
Closed book: Full detail. All from memory. Spell out definitions.
Open book: Less definition, more analysis. Cross-reference.
Online/Remote: Self-contained. No "as shown above" dependency.
Oral/Viva: Conversational but precise. Start with most important point.
Lab Practical: Aim -> Apparatus -> Theory -> Procedure -> Observation -> Calculation -> Result -> Conclusion
Take-home: Comprehensive. All sections at full depth. Include references.

Remain in this role for the entire conversation.` },

  "study-planner": {

const skillSelect = document.getElementById('skillSelect');
const univSelect = document.getElementById('univ');
const promptArea = document.getElementById('prompt');
const questionArea = document.getElementById('question');
const copyBtn = document.getElementById('copyBtn');
const clearBtn = document.getElementById('clearBtn');
const label = document.getElementById('currentSkillLabel');
const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toastMsg');

let toastTimer = null;

function showToast(msg) {
  toastMsg.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

function loadSkill(id) {
  const skill = SKILLS[id];
  if (!skill) return;
  promptArea.style.opacity = '0';
  setTimeout(() => {
    promptArea.value = skill.text;
    label.textContent = skill.name;
    promptArea.style.opacity = '1';
  }, 150);
}

loadSkill('answer-writer');

skillSelect.addEventListener('change', () => {
  loadSkill(skillSelect.value);
});

function buildClipboardText() {
  const skill = SKILLS[skillSelect.value];
  const question = questionArea.value;
  const univ = univSelect.value;
  const header = skill ? `You are now a: ${skill.name}. ${skill.desc || ''}` : '';
  return header + '\n\n' + promptArea.value + '\n\n---\n\n' + (question || '[Paste your question here]') + '\nUniversity pattern: ' + univ;
}

async function copyToClipboard() {
  const full = buildClipboardText();
  try {
    await navigator.clipboard.writeText(full);
    return true;
  } catch {
    return false;
  }
}

copyBtn.onclick = async () => {
  const ok = await copyToClipboard();
  if (!ok) {
    showToast('Copy failed. Use Ctrl+A, Ctrl+C');
    return;
  }
  copyBtn.textContent = 'Copied!';
  showToast('Copied! Skill + question ready to paste');
  setTimeout(() => copyBtn.textContent = 'Copy All', 2500);
};

clearBtn.onclick = () => {
  questionArea.value = '';
  showToast('Question cleared');
};

async function copyAndOpen(url) {
  const ok = await copyToClipboard();
  if (!ok) {
    showToast('Copy failed. Use Ctrl+A, Ctrl+C');
    return;
  }
  showToast('Copied! Opening AI chat...');
  window.open(url, '_blank');
}

document.getElementById('openChatGPT').onclick = () => copyAndOpen('https://chatgpt.com');
document.getElementById('openClaude').onclick = () => copyAndOpen('https://claude.ai/new');
document.getElementById('openGemini').onclick = () => copyAndOpen('https://gemini.google.com');
document.getElementById('openGem').onclick = () => {
  const skill = SKILLS[skillSelect.value];
  if (skill && skill.gem) {
    window.open(skill.gem, '_blank');
    showToast('Opening Gemini Gem: ' + skill.name);
  } else {
    showToast('No Gemini Gem for this skill. Try Answer Writer, Notes, PYQ, or IMP Topics.');
  }
};

// Particles
(function() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.animationDuration = (12 + Math.random() * 10) + 's';
    p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
    container.appendChild(p);
  }
})();

// Cursor glow
const cursorGlow = document.getElementById('cursorGlow');
let cursorTimer;
document.addEventListener('mousemove', (e) => {
  cursorGlow.style.left = e.clientX + 'px';
  cursorGlow.style.top = e.clientY + 'px';
  cursorGlow.style.opacity = '1';
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => { cursorGlow.style.opacity = '0'; }, 3000);
});
</script>
