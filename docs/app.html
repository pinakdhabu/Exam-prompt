<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); height: 100vh; display: flex; flex-direction: column; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

  .controls { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }

    background: transparent; border: 1px solid var(--border); color: var(--text);

  button.primary { background: var(--accent); border-color: var(--accent); color: #0c0c0e; }

  main { flex: 1; display: flex; flex-direction: column; max-width: 960px; margin: 0 auto; padding: 12px 16px; width: 100%; min-height: 0; }

    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); padding: 10px 12px; font-size: 0.8rem; font-family: var(--font-mono);

List/Enumerate: Numbered items. One phrase per item.
Explain/Describe: Definition + 3-6 mechanism points + closing.
Discuss/Elaborate: Definition + mechanism + types + pros/cons + applications + closing.
Short note: Definition + 4-6 points + diagram + closing.

Justify/Argue: Claim + 3-5 logical reasons + evidence + closing.

const skillSelect = document.getElementById('skillSelect');
const univSelect = document.getElementById('univ');
const promptArea = document.getElementById('prompt');
const questionArea = document.getElementById('question');
const resultArea = document.getElementById('result');
const copyBtn = document.getElementById('copyBtn');
const clearBtn = document.getElementById('clearBtn');
const label = document.getElementById('currentSkillLabel');

function loadSkill(id) {
  const skill = SKILLS[id];
  if (!skill) return;
  promptArea.value = skill.text;
  label.textContent = skill.name;
}

loadSkill('answer-writer');

skillSelect.addEventListener('change', () => {
  loadSkill(skillSelect.value);
  resultArea.style.display = 'none';
});

function buildClipboardText() {
  const skill = SKILLS[skillSelect.value];
  const question = questionArea.value;
  const univ = univSelect.value;
  const header = skill ? `You are now a: ${skill.name}. ${skill.desc || ''}` : '';
  return header + '\n\n' + promptArea.value + '\n\n---\n\n' + (question || '[Paste your question here]') + '\nUniversity pattern: ' + univ;
}

async function copyToClipboard() {
  const full = buildClipboardText();
  try {
    await navigator.clipboard.writeText(full);
    return true;
  } catch {
    return false;
  }
}

function showResult(msg) {
  resultArea.textContent = msg;
  resultArea.style.display = 'block';
}

copyBtn.onclick = async () => {
  const ok = await copyToClipboard();
  if (!ok) {
    showResult('Copy failed. Select all text manually (Ctrl+A, Ctrl+C).');
    return;
  }
  copyBtn.textContent = 'Copied!';
  const skill = SKILLS[skillSelect.value].name;
  showResult('copied to clipboard\n\n$ paste into your AI — skill + question included\n$ follow-ups keep the same role active');
  setTimeout(() => copyBtn.textContent = 'Copy All', 2000);
};

clearBtn.onclick = () => {
  questionArea.value = '';
  resultArea.style.display = 'none';
};

async function copyAndOpen(url) {
  const ok = await copyToClipboard();
  if (!ok) {
    showResult('Copy failed. Select all manually (Ctrl+A, Ctrl+C).');
    return;
  }
  showResult('Copied! Paste into the chat that just opened.');
  window.open(url, '_blank');
}

document.getElementById('openChatGPT').onclick = () => copyAndOpen('https://chatgpt.com');
document.getElementById('openClaude').onclick = () => copyAndOpen('https://claude.ai/new');
document.getElementById('openGemini').onclick = () => copyAndOpen('https://gemini.google.com');
document.getElementById('openGem').onclick = () => {
  const skill = SKILLS[skillSelect.value];
  if (skill && skill.gem) {
    window.open(skill.gem, '_blank');
    showResult('opening gemini gem: ' + skill.name);
  } else {
    showResult('no gemini gem available for this skill. try: answer-writer, notes, pyq, or imp-topics.');
  }
};
</script>
