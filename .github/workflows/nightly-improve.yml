name: Nightly Self-Improve

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  self-improve:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        continue-on-error: true
        run: npm install --no-audit --no-fund 2>&1 | tail -3

      - name: Validate all skills
        id: validate
        continue-on-error: true
        run: |
          if bash scripts/validate-skills.sh 2>&1; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
          fi

      - name: Check for orphan skill directories
        id: orphans
        run: |
          orphans=0
          for dir in skills/*/; do
            if [ ! -f "$dir/SKILL.md" ]; then
              name=$(basename "$dir")
              echo "Orphan: $name"
              orphans=$((orphans + 1))
            fi
          done
          echo "count=$orphans" >> $GITHUB_OUTPUT

      - name: Register new skills
        continue-on-error: true
        run: |
          if [ -f scripts/generate-agents-md.sh ]; then
            bash scripts/generate-agents-md.sh --dry-run 2>&1 | head -5 || true
          fi

      - name: Check for stale dependencies
        id: deps
        run: |
          if [ -f package.json ] && [ -f package-lock.json ]; then
            python3 -c "
import json
pkg = json.load(open('package.json'))
lock = json.load(open('package-lock.json'))
if pkg.get('dependencies', {}) or pkg.get('devDependencies', {}):
    print('dependencies:found')
else:
    print('dependencies:none')
" 2>/dev/null || echo "WARN: could not check dependencies"
          fi

      - name: Check for TODO/FIXME/HACK comments
        id: todos
        continue-on-error: true
        run: |
          count=$(grep -r 'TODO\|FIXME\|HACK' \
            --include='*.py' --include='*.js' --include='*.sh' \
            --include='*.md' --include='*.yml' --include='*.yaml' \
            --exclude-dir=node_modules --exclude-dir=.git \
            --exclude-dir=.github 2>/dev/null | wc -l || echo 0)
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "Found $count TODO/FIXME/HACK comments"

      - name: Check QP website availability
        id: website
        continue-on-error: true
        timeout-minutes: 1
        run: |
          if curl -sI --max-time 5 'https://sppuquestionpapers.com' &>/dev/null; then
            echo "status=up" >> $GITHUB_OUTPUT
            echo "OK: QP website is reachable"
          else
            echo "status=down" >> $GITHUB_OUTPUT
            echo "WARN: QP website is unreachable (offline mode still works)"
          fi

      - name: Collate report
        id: report
        run: |
          ORPHANS=${{ steps.orphans.outputs.count || '0' }}
          TODOS=${{ steps.todos.outputs.count || '0' }}
          WEBSITE=${{ steps.website.outputs.status || 'unknown' }}
          VALIDATE=${{ steps.validate.outputs.status || 'unknown' }}

          ISSUES=()
          [ "$ORPHANS" -gt 0 ] && ISSUES+=("orphan-count=$ORPHANS")
          [ "$TODOS" -gt 0 ] && ISSUES+=("todos=$TODOS")

          {
            echo "## Nightly Report ($(date -u +%Y-%m-%d))"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Skill validation | $VALIDATE |"
            echo "| Orphan skills | $ORPHANS |"
            echo "| TODO/FIXME comments | $TODOS |"
            echo "| QP website | $WEBSITE |"
          } > /tmp/nightly-report.md

          if [ ${#ISSUES[@]} -gt 0 ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit auto-fixes
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "nightly: auto-fix $(date -u +%Y-%m-%d)"
          add_options: '-A'

      - name: Open or update issue for remaining issues
        if: steps.report.outputs.report_exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/nightly-report.md', 'utf8');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['nightly-report']
            });
            if (issues.data.length > 0) {
              await github.rest.issues.update({
                issue_number: issues.data[0].number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Nightly Report: ${new Date().toISOString().split('T')[0]}`,
                body: report
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Nightly Report: ${new Date().toISOString().split('T')[0]}`,
                body: report,
                labels: ['nightly-report', 'auto-generated']
              });
            }

      - name: Close nightly issue when all clear
        if: steps.report.outputs.report_exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['nightly-report']
            });
            for (const issue of issues.data) {
              await github.rest.issues.update({
                issue_number: issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                state_reason: 'completed'
              });
            }
