name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint check
        run: npm run lint

      - name: Validate skills
        run: bash scripts/validate-skills.sh

      - name: Base integrity check
        run: npm test

      - name: Validate fonts
        run: node -e "const f=require('fs'),p=require('path');const e=['times/Times.TTF','dejavu/DejaVuSans.ttf','caskaydia/CaskaydiaCoveNerdFontMono-Regular.ttf','termes-math/texgyretermes-math.otf','noto-sans-devanagari/NotoSansDevanagari-Regular.ttf','opendyslexic/OpenDyslexic3-Regular.ttf','klee/Klee-Regular.ttf','shobhika/Shobhika-Regular.otf','mukta/Mukta-Regular.ttf','patrick-hand/PatrickHand-Regular.ttf','chilanka/Chilanka-Regular.ttf'];let m=e.filter(f=>!fs.existsSync(p.join('fonts',f)));m.length?console.log('FAIL: missing fonts:',m.join(', ')):console.log('OK: '+e.length+' essential fonts present');process.exit(m.length?1:0)"

      - name: Validate skills.json structure
        run: |
          python3 -c "
          import json
          with open('skills/skills.json') as f:
              data = json.load(f)
          assert data['total_skills'] == len(data['skills']), 'total_skills mismatch'
          for s in data['skills']:
              assert s['name'] and s['directory'] and s['version'], f'missing field in {s.get(\"name\",\"?\")}'
          print(f'OK: {len(data[\"skills\"])} skills validated in skills.json')
          "

      - name: Check for duplicate skill directories
        run: |
          dups=$(ls -d skills/*/ 2>/dev/null | sed 's|skills/||;s|/||' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "ERROR: Duplicate skill directories: $dups"
            exit 1
          fi
          echo "OK: No duplicate skill directories"
