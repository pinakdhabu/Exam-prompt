name: Auto-Register Skills

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**/SKILL.md'
      - '.github/workflows/sync-skills.yml'
  schedule:
    # Also run nightly as part of rolling release
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Count skills
        id: count
        run: |
          COUNT=$(ls -d skills/*/ 2>/dev/null | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT skills"

      - name: Auto-generate AGENTS.md
        run: |
          AGENTS="AGENTS.md"
          SKILLS_DIR="skills"

          # Extract header (everything before <available_skills>)
          HEADER=$(sed '/<available_skills>/q' "$AGENTS" | sed '$d')
          # Extract footer (everything after </available_skills>)
          FOOTER=$(sed -n '/<\/available_skills>/,$$p' "$AGENTS" | sed '1d')

          # Build the new <available_skills> block
          {
            echo "$HEADER"
            echo ""
            echo "<available_skills>"
            echo ""
            for dir in "$SKILLS_DIR"/*/; do
              name=$(basename "$dir")
              skill_file="$dir/SKILL.md"
              [ ! -f "$skill_file" ] && continue

              # Extract name from YAML frontmatter
              fm_name=$(sed -n '/^---$/,/^---$/p' "$skill_file" | grep '^name:' | sed 's/^name: *//' | tr -d '[:space:]')
              [ -z "$fm_name" ] && fm_name="$name"

              # Extract description from YAML frontmatter (handles > block scalar)
              fm_desc=$(awk '
                /^---$/ { count++; next }
                count == 1 { desc = desc sep $0; sep = " " }
                count == 2 { exit }
                END { print desc }
              ' "$skill_file" | grep -v '^name:' | sed 's/^description: *> *//; s/^description: *//' | xargs)
              [ -z "$fm_desc" ] && fm_desc="No description provided."

              cat <<SKILL_EOF
            <skill>
            <name>$fm_name</name>
            <description>$fm_desc</description>
            <location>project</location>

            SKILL_EOF
            done
            echo "</available_skills>"
            echo ""
            echo "$FOOTER"
          } > /tmp/agents_new.md

          # Preserve the <!-- SKILLS_TABLE_END --> comment at the end of the block
          if grep -q 'SKILLS_TABLE_END' /tmp/agents_new.md; then
            : # already has it
          else
            echo "<!-- SKILLS_TABLE_START -->" >> /tmp/agents_new.md
            echo "<!-- SKILLS_TABLE_START -->" >> /tmp/agents_new.md
            echo "<!-- SKILLS_TABLE_START -->" >> /tmp/agents_new.md
            echo "<!-- SKILLS_TABLE_START -->" >> /tmp/agents_new.md
            cat /tmp/agents_new.md > /tmp/agents_final.md
            # Actually just add it after </available_skills>
            sed -i '/<\/available_skills>/a <!-- SKILLS_TABLE_END -->' /tmp/agents_new.md
          fi

          mv /tmp/agents_new.md "$AGENTS"
          echo "Regenerated AGENTS.md"

      - name: Update README with dynamic badges
        run: |
          SKILL_COUNT=$(ls -d skills/*/ 2>/dev/null | wc -l)
          PAPER_COUNT=$(find examples/ -name 'sample-paper-*.md' 2>/dev/null | wc -l)
          SOLUTION_COUNT=$(find examples/ -name '*-solution.md' 2>/dev/null | wc -l)

          # Generate a dynamic status badge line
          BADGES="![Skills](https://img.shields.io/badge/skills-$SKILL_COUNT-blue)"
          BADGES="$BADGES ![Papers](https://img.shields.io/badge/sample_papers-$PAPER_COUNT-green)"
          BADGES="$BADGES ![Solutions](https://img.shields.io/badge/solutions-$SOLUTION_COUNT-orange)"
          BADGES="$BADGES ![Rolling](https://img.shields.io/badge/release-rolling-ff69b4)"
          BADGES="$BADGES ![License](https://img.shields.io/badge/license-MIT-brightgreen)"

          # Update or insert the badge line in README.md
          if grep -q '!\\[Skills\\]' README.md 2>/dev/null; then
            # Update existing badge line (matches the first ![Skills] badge)
            sed -i '0,/!\\[Skills\\].*/s/!\\[Skills\\].*/BADGES_PLACEHOLDER/' README.md
            sed -i "s|BADGES_PLACEHOLDER|$BADGES|" README.md
          else
            # Insert after the title
            sed -i '2i\\n'"$BADGES" README.md
          fi
          echo "Updated README badges"

      - name: Update docs skill count
        run: |
          COUNT=$(ls -d skills/*/ 2>/dev/null | wc -l)
          # Update all visible references in the docs site
          for html_file in docs/index.html docs/skills.html; do
            if [ -f "$html_file" ]; then
              # Update stat blocks: "24 skills" or "20 skills" pattern
              sed -i "s/[0-9]\\+ skills/$COUNT skills/g" "$html_file"
              # Update footer: "24 academic skills"
              sed -i "s/[0-9]\\+ academic skills/$COUNT academic skills/g" "$html_file"
              echo "Updated $html_file skill count to $COUNT"
            fi
          done

          # Update the skills array count in docs/skills.html JS if needed
          if grep -q 'new Array' docs/skills.html 2>/dev/null; then
            sed -i "s/const skills = new Array([0-9]\\+)/const skills = new Array($COUNT)/" docs/skills.html
          fi

      - name: Commit auto-registration
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "nightly: auto-register skills, update badges and docs"
          add_options: '-A'
