name: Auto-Register Skills

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**/SKILL.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Count skills
        id: count
        run: |
          COUNT=$(ls -d skills/*/ | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT skills"

      - name: Auto-generate AGENTS.md
        run: |
          # Generate available_skills block from all skills
          # Read AGENTS.md and replace content between <available_skills> and </available_skills>
          AGENTS="AGENTS.md"
          SKILLS_DIR="skills"

          # Build the available_skills XML
          xml_start='<available_skills>'
          xml_end='</available_skills>'

          # Extract header (everything up to <available_skills>)
          sed -n '1,/<available_skills>/p' "$AGENTS" | head -n -1 > /tmp/agents_new.md
          echo "" >> /tmp/agents_new.md
          echo "$xml_start" >> /tmp/agents_new.md
          echo "" >> /tmp/agents_new.md

          for dir in "$SKILLS_DIR"/*/; do
            name=$(basename "$dir")
            skill_file="$dir/SKILL.md"
            if [ ! -f "$skill_file" ]; then
              echo "WARN: $name has no SKILL.md, skipping"
              continue
            fi

            # Extract name from frontmatter
            fm_name=$(sed -n '/^---$/,/^---$/p' "$skill_file" | grep '^name:' | sed 's/^name: //' | tr -d '[:space:]' || echo "$name")

            # Extract description (handles multiline YAML folded block scalars >)
            fm_desc=$(sed -n '/^---$/,/^---$/p' "$skill_file" | sed -n '/^description:/,/^[a-z]/p' | head -n -1 | sed 's/^description: *> *//' | sed 's/^description: *//' | sed 's/^ *//' | tr '\n' ' ' | sed 's/ *$//' || echo "No description.")

            {
              echo "<skill>"
              echo "<name>$fm_name</name>"
              echo "<description>$fm_desc</description>"
              echo "<location>project</location>"
              echo ""
            } >> /tmp/agents_new.md
          done

          echo "$xml_end" >> /tmp/agents_new.md
          echo '<!-- SKILLS_TABLE_END -->' >> /tmp/agents_new.md

          # Append the rest after </available_skills> in original
          tail -n +$(($(grep -n '</available_skills>' "$AGENTS" | head -1 | cut -d: -f1) + 3)) "$AGENTS" >> /tmp/agents_new.md

          mv /tmp/agents_new.md "$AGENTS"
          echo "Regenerated AGENTS.md"

      - name: Update README skill count
        run: |
          COUNT=$(ls -d skills/*/ | wc -l)
          # Update the number in the architecture tree line
          sed -i "s/skills\/.*Universal skill modules/skills\/                      #  $COUNT Universal skill modules/" README.md
          echo "Updated README with skill count: $COUNT"

      - name: Commit auto-registration
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-register skill in AGENTS.md"
          add_options: '-A'
          file_pattern: AGENTS.md README.md
