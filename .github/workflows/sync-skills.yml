name: Auto-Register Skills

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**/SKILL.md'
      - '.github/workflows/sync-skills.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Count skills
        id: count
        run: |
          COUNT=$(ls -d skills/*/ 2>/dev/null | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT skills"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auto-generate AGENTS.md and skills.json
        continue-on-error: true
        run: |
          if [ -f scripts/generate-skills-manifest.sh ]; then
            bash scripts/generate-skills-manifest.sh && echo "Regenerated AGENTS.md and skills.json"
          else
            echo "WARN: generate-skills-manifest.sh not found — using generate-agents-md.sh instead"
            bash scripts/generate-agents-md.sh || echo "WARN: AGENTS.md generation had issues"
          fi

      - name: Update README with dynamic badges
        continue-on-error: true
        run: |
          SKILL_COUNT=$(ls -d skills/*/ 2>/dev/null | wc -l)
          PAPER_COUNT=$(find examples/ -name 'sample-paper-*.md' 2>/dev/null | wc -l)
          SOLUTION_COUNT=$(find examples/ -name '*-solution.md' 2>/dev/null | wc -l)
          PDF_COUNT=$(find generated-examples/pdfs/ -name '*.pdf' 2>/dev/null | wc -l)

          BADGES="![Skills](https://img.shields.io/badge/skills-$SKILL_COUNT-blue?style=flat-square)"
          BADGES="$BADGES ![Universities](https://img.shields.io/badge/universities-10-orange?style=flat-square)"
          BADGES="$BADGES ![Subjects](https://img.shields.io/badge/subjects-50+-green?style=flat-square)"
          BADGES="$BADGES ![Papers](https://img.shields.io/badge/sample_papers-$PAPER_COUNT-yellow?style=flat-square)"
          BADGES="$BADGES ![License](https://img.shields.io/badge/license-MIT-brightgreen?style=flat-square)"

          if [ -f README.md ]; then
            echo "README exists, badges ready for manual insert: $BADGES"
          fi

      - name: Commit auto-registration
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "nightly: auto-register skills, update badges"
          add_options: '-A'
