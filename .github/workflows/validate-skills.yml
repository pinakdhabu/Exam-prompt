name: Validate Skills

on:
  push:
    paths:
      - 'skills/**/*.md'
      - 'scripts/validate-skills.sh'
      - 'scripts/validate-skills.ps1'
  pull_request:
    paths:
      - 'skills/**/*.md'
      - 'scripts/validate-skills.sh'
      - 'scripts/validate-skills.ps1'
  workflow_dispatch:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: npm install --no-audit --no-fund

      - name: Run validation (${{ matrix.os }})
        if: runner.os != 'Windows'
        run: bash scripts/validate-skills.sh
        shell: bash

      - name: Run Windows validation (lint + validate-skills.ps1)
        if: runner.os == 'Windows'
        run: npm run check:win

      - name: Cross-platform script syntax check
        if: runner.os != 'Windows'
        run: |
          echo "=== Checking shell scripts for cross-platform issues ==="
          for script in scripts/*.sh; do
            if command -v bash &>/dev/null; then
              bash -n "$script" && echo "OK: $script" || echo "FAIL: $script has syntax errors"
            fi
          done

  validate-universities:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Validate university registry
        run: |
          cd universities
          if command -v python3 &>/dev/null; then
            python3 -c "import json, os; reg=json.load(open('university-registry.json')); [print(f'WARN: {u[\"id\"]} -> {u.get(\"directory\",\"\")}/ not found') if u.get('directory') and not os.path.isdir(u['directory']) else print(f'OK: {u[\"id\"]} -> {u.get(\"directory\",\"\")}/ exists') for u in reg.get('universities', [])]"
          else
            echo "WARN: python3 not available, skipping deep validation"
          fi

  check-website:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - name: Check if QP website is reachable
        run: |
          if curl -sI --max-time 5 'https://sppuquestionpapers.com' &>/dev/null; then
            echo "OK: sppuquestionpapers.com is reachable"
          else
            echo "WARN: sppuquestionpapers.com is unreachable (this is OK — offline mode works)"
          fi
