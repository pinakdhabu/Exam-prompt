# ============================================================
# Exam Prompt — Repository Configuration
# Rolling Release Configuration
# ============================================================
# This repo follows a rolling release model (like Arch Linux):
# - No version numbers — main branch is always the latest
# - Every push is a "release"
# - CI/CD handles everything automatically
# - Users just need to git pull to stay updated

# ---- New Issue Welcome ----
newIssueWelcomeComment: |
  Thanks for opening an issue! 🎉

  **Rolling Release:** This repo has no versions — `main` is always latest.
  Before reporting, make sure you have the latest:
  ```
  git pull origin main
  bash scripts/self-update.sh --check-only
  ```

  I'll add labels shortly.

# ---- New PR Welcome ----
newPRWelcomeComment: |
  Thanks for contributing! 🚀

  **Rolling Release Policy:**
  - PRs are merged as soon as they're ready — no release cycles
  - After merge, your change is immediately "live"
  - Run `bash scripts/self-update.sh --fix` on your fork to re-validate

  A maintainer will review your PR soon.

# ---- First PR Merge ----
firstPRMergeComment: |
  🎉 Welcome to the contributors club!

  You're now officially part of the Exam Prompt community.
  Your change is live on `main` — helping students worldwide.

  Interested in becoming a maintainer? Open a discussion!

# ---- Issue/PR Label Management ----
# Auto-add labels based on issue content (simple keyword matching)
labels:
  # Rolling release labels
  - name: rolling-release
    color: "#0366d6"
    description: "Part of the rolling release cycle"
  - name: nightly-report
    color: "#d93f0b"
    description: "Auto-generated nightly improvement report"
  - name: auto-generated
    color: "#6f42c1"
    description: "Auto-generated by CI/CD"

  # Content type labels
  - name: sample-paper
    color: "#0e8a16"
    description: "Related to sample papers"
  - name: skill
    color: "#1d76db"
    description: "Related to SKILL.md files"
  - name: script
    color: "#e4e669"
    description: "Related to scripts/ directory"
  - name: docs
    color: "#5319e7"
    description: "Documentation improvements"
  - name: ci/cd
    color: "#fbca04"
    description: "CI/CD workflow improvements"

  # Priority labels
  - name: urgent
    color: "#b60205"
    description: "Critical issue — breaks the system"
  - name: high-priority
    color: "#d93f0b"
    description: "Important but not critical"
  - name: good-first-issue
    color: "#7057ff"
    description: "Good for new contributors"
  - name: help-wanted
    color: "#008672"
    description: "Needs community help"
  - name: question
    color: "#cc317c"
    description: "Question or discussion"

# ---- Stale Issue Management ----
# Issues/PRs with no activity get marked stale then closed
stale:
  daysUntilStale: 90
  daysUntilClose: 14
  staleLabel: stale
  staleIssueMessage: |
    This issue has been inactive for 90 days.
    If it's still relevant, please comment to keep it open.
    Otherwise it will be closed in 14 days.
  stalePRMessage: |
    This PR has been inactive for 90 days.
    Please address review comments to keep it moving.
  closeMessage: |
    Closing due to inactivity.
    Feel free to reopen when you're ready to continue.
